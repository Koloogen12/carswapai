# CarSwap AI · обратный прокси.
#
# Снаружи виден только этот контейнер. Приложение и база портов не
# публикуют вовсе.
#
# По умолчанию поднимается HTTP: на чистом сервере сертификата ещё нет, и
# конфиг со ссылкой на несуществующий .pem не даст nginx стартовать.
# Порядок выпуска сертификата и включения TLS — deploy/README.md.

upstream carswap_app {
    server app:3000;
    keepalive 32;
}

# Логи без тела и без query-строки: туда попали бы ПД клиентов, а логи
# прокси не входят в контур, для которого объявлен режим обработки ПД.
log_format carswap '$remote_addr - [$time_local] "$request_method $uri" '
                   '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    # Домен подставляется руками вместе с включением TLS.
    server_name _;

    access_log /var/log/nginx/access.log carswap;
    server_tokens off;

    # Фото машины с телефона — единицы мегабайт. Запас, но не бесконечный:
    # без предела сюда зальют что угодно.
    client_max_body_size 25m;
    client_body_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Картинки и видео уже сжаты, повторное сжатие только греет процессор.

    include /etc/nginx/carswap/security-headers.inc;

    # Ответ прокси о себе, для healthcheck. Приложение не трогает,
    # поэтому не соврёт «жив», когда приложение уже умерло.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Место для http-01 проверки certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # ── хранилище фото и рендеров ───────────────────────────────────────
    # Отдаётся с диска, мимо Node: фото на воркерах приложения — это
    # воркеры, занятые статикой, вместо экранов.
    location /storage/ {
        alias /var/lib/carswap/storage/;
        autoindex off;
        try_files $uri =404;

        include /etc/nginx/carswap/security-headers.inc;
        # Имена в хранилище содержат sha256 содержимого — файл по адресу
        # не меняется. private, а не public: это фото машин клиентов,
        # промежуточным кэшам их держать нельзя.
        add_header Cache-Control "private, max-age=2592000, immutable" always;
    }

    # Иммутабельная статика Next: имена содержат хэш сборки.
    location /_next/static/ {
        proxy_pass http://carswap_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        include /etc/nginx/carswap/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── приложение ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://carswap_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering on;

        include /etc/nginx/carswap/security-headers.inc;
    }
}

# ── TLS ─────────────────────────────────────────────────────────────────
# Раскомментировать ПОСЛЕ выпуска сертификата (см. deploy/README.md),
# подставив свой домен, и заодно превратить блок выше в редирект на https:
#   location / { return 301 https://$host$request_uri; }
# оставив /healthz и /.well-known/acme-challenge/ на HTTP.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name carswap.example.ru;
#
#     ssl_certificate     /etc/letsencrypt/live/carswap.example.ru/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/carswap.example.ru/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # Дальше — те же location, что в блоке 80, вместе с
#     # include /etc/nginx/carswap/security-headers.inc; в каждом.
# }
